                def test_complete_insufficient_memory_helper_capture(self) -> None:
                    # capsule_update_test_cases.zip, TC07_insufficient_memory.log producer sections.
                    # Captured host fault injection with a test double; no board/reboot execution.
                    results = dedent("""\
                        Testing generation of negative capsules from signed_capsule.bin
                        Test_Info
                        signed_capsule.bin size: 4096 bytes
                        MemAvailable: 7368296 KiB, SwapFree: 6282192 KiB
                        Estimated memory required: 999999999999 KiB
                        Available storage: 139957920 KiB, required: 8 KiB
                        WARNING: Target system does not have sufficient memory to generate unauth.bin and tampered.bin on-device
                        Generate unauth.bin and tampered.bin from the same signed_capsule.bin offline, then copy them into /mnt/acs_tests/app before running capsule update
                        Insufficient memory for on-device capsule variant generation
                        Generate unauth.bin and tampered.bin from the same signed_capsule.bin offline, then copy them into /mnt/acs_tests/app before running capsule update
                    """)
                    on_disk = dedent("""\
                        Testing generation of negative capsules from signed_capsule.bin
                        Test_Info
                    """)
                    data = self.parse(results, on_disk=on_disk)
                    self.assertEqual(len(data["test_results"][0]["subtests"]), 1)
                    self.assert_generation(data, "SKIPPED", "Insufficient memory", OFFLINE)
                    self.assertEqual(data["suite_summary"]["total_skipped"], 1)
                    self.assertEqual(data["suite_summary"]["total_failed"], 0)
                    self.assertEqual(data["suite_summary"]["total_passed"], 0)

                def test_resource_footer_does_not_hide_state_failures(self) -> None:
                    resources = ("Insufficient memory for on-device capsule variant generation",
                                 "Insufficient storage for on-device capsule variant generation")
                    footer = "Capsule update is unsupported on this platform"
                    errors = ("Capsule update setup has failed",
                              "Failed to clear generation marker after controlled pre-publish failure",
                              "Failed to persist capsule generation failure state")
                    for resource in resources:
                        with self.subTest(resource=resource):
                            self.assert_generation(
                                self.parse(generation(resource, OFFLINE, footer)), "SKIPPED", resource, footer
                            )
                        for error in errors:
                            with self.subTest(resource=resource, error=error):
                                self.assert_generation(
                                    self.parse(generation(resource, OFFLINE, error)), "FAILED", error
                                )

                def test_incomplete_attempts_fail_without_claiming_variant_success(self) -> None:
                    cases = (
                        generation(), generation("Test_Info"), generation(RESOURCE_INFO),
                        generation(PROGRESS), generation(RECOVERY),
                    )
                    for text in cases:
                        with self.subTest(log=text):
                            self.assert_generation(self.parse(text), "FAILED")

                def test_latest_attempt_controls_and_preserves_superseded_evidence(self) -> None:
                    failed = "Failed to publish generated tampered.bin"
                    unsupported = generation("Insufficient storage to generate capsule variants", OFFLINE)
                    cases = [
                        (generation(failed, SETUP_FAILED) + generation(RECOVERY, SUCCESS), "PASSED", failed),
                        (generation(SUCCESS) + generation(PROGRESS), "FAILED", SUCCESS),
                        (generation(SUCCESS) + generation("unrecognized producer outcome"), "FAILED", SUCCESS),
                        (generation(SUCCESS) + unsupported, "SKIPPED", SUCCESS),
                        (unsupported + generation(REUSE), "PASSED", OFFLINE),
                    ]
                    for log, status, previous in cases:
                        with self.subTest(status=status, log=log):
                            row = self.assert_generation(self.parse(log), status, previous)
                            self.assertIn("superseded", reason_text(row).lower())

                def test_explicit_failure_overrides_success_in_same_attempt(self) -> None:
                    failures = [
                        SETUP_FAILED,
                        "Capsule update setup has failed",
                        "Failed to generate valid unauth.bin",
                        "Failed to publish generated tampered.bin",
                        "Failed to synchronize generated capsule variants",
                    ]
                    for failure in failures:
                        for lines in ((SUCCESS, failure), (failure, SUCCESS)):
                            with self.subTest(lines=lines):
                                self.assert_generation(self.parse(generation(*lines)), "FAILED", failure)

                def test_resource_and_success_conflict_is_failed(self) -> None:
                    unsupported = "Insufficient memory for on-device capsule variant generation"
                    for terminal in (SUCCESS, REUSE):
                        for lines in ((unsupported, terminal), (terminal, unsupported)):
                            with self.subTest(lines=lines):
                                self.assert_generation(self.parse(generation(*lines)), "FAILED", unsupported, terminal)

                def test_following_headings_bound_generation_evidence(self) -> None:
                    headings = (
                        "Testing unrelated operation", "Test: unrelated operation", "Test: Testing unrelated operation"
                    )
                    for heading in headings:
                        with self.subTest(heading=heading):
                            # A later section cannot complete an incomplete generation attempt.
                            self.assert_generation(self.parse(generation(PROGRESS) + heading + "\n" + SUCCESS), "FAILED")
                            # A later section's error cannot invalidate an already completed pair.
                            self.assert_generation(
                                self.parse(generation(SUCCESS) + heading + "\n" + SETUP_FAILED), "PASSED"
                            )

                def test_generation_heading_with_test_prefix(self) -> None:
                    log = "Test: " + generation(SUCCESS)
                    self.assert_generation(self.parse(log), "PASSED", SUCCESS)

                def test_no_generation_record_without_generation_heading(self) -> None:
                    data = self.parse("Testing unrelated operation\n" + SUCCESS + "\n" + SETUP_FAILED)
                    self.assertEqual(data["test_results"][0]["subtests"], [])

                def test_failure_mirrored_in_on_disk_log_is_not_counted_twice(self) -> None:
                    data = self.parse(
                        generation("Test_Info", MISSING_SIGNED_CAPSULE),
                        on_disk=generation("Test_Info", "signed_capsule.bin not present"),
                    )
                    self.assert_generation(data, "FAILED", MISSING_SIGNED_CAPSULE)
                    self.assertEqual(data["suite_summary"]["total_failed"], 1)

                def test_legacy_update_records_are_unchanged(self) -> None:
                    update = (
                        "Testing unauth.bin update\nTest_Info\n"
                        "CapsuleApp: failed to update capsule - Security Violation\n"
                        "Testing tampered.bin update\nTest_Info\n"
                        "tampered.bin not present\n"
                    )
                    on_disk = "Testing signed_capsule.bin OD update\nTest_Info\nSucceed to write signed_capsule.bin\n"
                    results = (
                        "Testing signed_capsule.bin sanity\nWARNING: partner capsule version is unchanged\n"
                        "Testing ESRT FW version update\nINFO: Expected firmware version was not installed\n"
                        "RESULTS: Overall Capsule Update Result: FAILED\n"
                        "Testing Capsule On-Disk Update Reporting Variables\n\n"
                        "INFO: CapsuleLast Variable - Not Found\n"
                        "RESULTS: Overall Capsule On-Disk Update Reporting Variables Result: WARNING\n"
                    )
                    baseline = self.parse(results, update, on_disk)
                    legacy = baseline["test_results"][0]["subtests"]
                    self.assertEqual(len(legacy), 6)
                    legacy_statuses = [
                        next(key for key in STATUS_KEYS if row["sub_test_result"][key]) for row in legacy
                    ]
                    self.assertEqual(legacy_statuses, ["PASSED", "FAILED", "PASSED", "PASSED", "FAILED", "WARNINGS"])
                    with_generation = self.parse(generation(SUCCESS) + results, update, on_disk)
                    self.assertEqual(with_generation["test_results"][0]["subtests"][:-1], legacy)
                    self.assert_generation(with_generation, "PASSED", SUCCESS)


            unittest.main(verbosity=2)

