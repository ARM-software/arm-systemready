suites:

  - name: logs_to_json_common
    files:
      - common/log_parser/bbr/fwts/logs_to_json.py
      - common/log_parser/bbr/sct/logs_to_json.py
      - common/log_parser/bbr/tpm/logs_to_json.py
      - common/log_parser/bsa/logs_to_json.py
      - common/log_parser/os_tests/logs_to_json.py
      - common/log_parser/pfdi/logs_to_json.py
      - common/log_parser/post_script/logs_to_json.py
      - common/log_parser/sbmr/logs_to_json.py
      - common/log_parser/scmi/logs_to_json.py
      - common/log_parser/standalone_tests/logs_to_json.py
      - common/log_parser/os_tests/sr_logs_to_json.py
      - common/log_parser/bbr/sct/logs_to_json_edk2.py

    cases:
      - name: file_exists
        type: file_exists

      - name: python_compiles
        type: py_compile

      - name: contains_json_usage
        type: source_contains
        pattern: "json"

      - name: contains_parse_logic
        type: source_contains_any
        patterns:
          - "parse"
          - "parser"
          - "parse_"

      - name: contains_result_collection_logic
        type: source_contains_any
        patterns:
          - "subtest"
          - "test_results"
          - "results"

      # 🔧 FIXED: works for edk2 also
      - name: contains_summary_logic
        type: source_contains_any
        patterns:
          - "summary"
          - "suite_summary"
          - "total_"
          - "\"result\""
          - "\"reason\""

      - name: contains_output_logic
        type: source_contains_any
        patterns:
          - "json.dump"
          - "write"

      - name: has_main_guard
        type: main_guard


  - name: capsule_generation_parser
    files:
      - common/log_parser/standalone_tests/logs_to_json.py
    cases:
      - name: generation_outcomes_recovery_and_legacy_regression
        type: cli
        command: python3
        args:
          - "{dir}/capsule_generation_tests.py"
          - "{file}"
        expect_exit_code: 0
        timeout_sec: 30
        scripts:
          capsule_generation_tests.py: |
            # Copyright (c) 2026, Arm Limited or its affiliates. All rights reserved.
            # SPDX-License-Identifier: Apache-2.0
            """Regression checks for capsule preparation results and legacy update records.

            Fixtures contain complete captured logs and focused producer fragments, not
            harness PASS assertions. They test parsing, not firmware acceptance.
            """

            import importlib.util
            import json
            from pathlib import Path
            import sys
            import tempfile
            from textwrap import dedent
            import unittest


            PARSER_PATH = Path(sys.argv.pop(1)).resolve()
            spec = importlib.util.spec_from_file_location("capsule_generation_parser", PARSER_PATH)
            assert spec is not None and spec.loader is not None
            parser = importlib.util.module_from_spec(spec)
            spec.loader.exec_module(parser)

            HEADER = "Testing generation of negative capsules from signed_capsule.bin"
            DESCRIPTION = "Negative capsule preparation"
            SUCCESS = "Successfully generated unauth.bin and tampered.bin on-device"
            REUSE = "Using existing pre-generated negative capsule variants; skipping on-device generation"
            RECOVERY = "Previous on-device generation was interrupted; discarding untrusted variants"
            SETUP_FAILED = "Capsule variant generation or setup failed on-device"
            MISSING_SIGNED_CAPSULE = (
                "signed_capsule.bin not present, empty, or unreadable; "
                "skipping on-device capsule variant generation"
            )
            OFFLINE = (
                "Generate unauth.bin and tampered.bin from the same signed_capsule.bin offline, "
                "then copy them into /mnt/acs_tests/app before running capsule update"
            )
            PROGRESS = "Generating unauth.bin from signed_capsule.bin\nGenerating tampered.bin from signed_capsule.bin"
            RESOURCE_INFO = (
                "signed_capsule.bin size: 4096 bytes\n"
                "MemAvailable: 7368296 KiB, SwapFree: 6282192 KiB\n"
                "Estimated memory required: 262144 KiB\n"
                "Available storage: 139957920 KiB, required: 8 KiB"
            )
            STATUS_KEYS = (
                "PASSED", "FAILED", "FAILED_WITH_WAIVER", "ABORTED", "SKIPPED", "WARNINGS"
            )


            def generation(*lines: str) -> str:
                return HEADER + "\n" + "\n".join(lines) + "\n"


            def reason_text(subtest: dict) -> str:
                result = subtest["sub_test_result"]
                return json.dumps({key: value for key, value in result.items() if "reason" in key})


            class CapsuleGenerationParserTests(unittest.TestCase):
                def parse(self, results: str, update: str = "", on_disk: str = "") -> dict:
                    with tempfile.TemporaryDirectory(prefix="capsule-parser-") as directory:
                        root = Path(directory)
                        update_path = root / "capsule-update.log"
                        on_disk_path = root / "capsule-on-disk.log"
                        results_path = root / "capsule_test_results.log"
                        update_path.write_text(update, encoding="utf-16")
                        on_disk_path.write_text(on_disk, encoding="utf-16")
                        results_path.write_text(results, encoding="utf-8")
                        data = parser.parse_capsule_update_logs(
                            str(update_path), str(on_disk_path), str(results_path)
                        )
                    # Also exercise the machine-readable representation used by consumers.
                    data = json.loads(json.dumps(data))
                    self.assertEqual(len(data["test_results"]), 1)
                    test = data["test_results"][0]
                    self.assertEqual(test["test_suite_summary"], data["suite_summary"])
                    for status in STATUS_KEYS:
                        expected = sum(row["sub_test_result"][status] for row in test["subtests"])
                        self.assertEqual(data["suite_summary"]["total_" + status.lower()], expected)
                    for number, row in enumerate(test["subtests"], 1):
                        self.assertEqual(row["sub_Test_Number"], str(number))
                        self.assertEqual(sum(row["sub_test_result"][key] for key in STATUS_KEYS), 1)
                    return data

                def assert_generation(self, data: dict, status: str, *evidence: str) -> dict:
                    rows = data["test_results"][0]["subtests"]
                    generated = [row for row in rows if row["sub_Test_Description"] == DESCRIPTION]
                    self.assertEqual(len(generated), 1, "A capsule pair has one atomic preparation result")
                    row = generated[0]
                    self.assertIs(row, rows[-1], "Generation must not renumber existing update records")
                    self.assertEqual(row["sub_test_result"][status], 1)
                    for text in evidence:
                        self.assertIn(text, reason_text(row))
                    return row

                def test_supplied_generation_scenarios(self) -> None:
                    """Cover all 15 attachment scenarios using only their producer output."""
                    missing_tool = "capsule-tool.py not found or not readable at <case-workdir>/capsule-tool.py"
                    invalid_memory = "Invalid capsule memory threshold configuration"
                    short_memory = "Insufficient memory for on-device capsule variant generation"
                    short_storage = "Insufficient storage to generate capsule variants"
                    failed_unauth = "Failed to generate valid unauth.bin"
                    failed_tamper = "Failed to generate valid tampered.bin"
                    failed_publish = "Failed to publish generated tampered.bin"
                    failed_sync = "Failed to synchronize generated capsule variants"
                    failed_marker_sync = "Failed to synchronize capsule generation transaction marker"
                    marker_cleared = "Cleared generation marker after controlled pre-publish failure"
                    partial_failure = generation("Test_Info", RESOURCE_INFO, PROGRESS, failed_publish, SETUP_FAILED)
                    cases = [
                        ("TC01 fresh generation", generation(RESOURCE_INFO, PROGRESS, SUCCESS), "PASSED", SUCCESS),
                        ("TC02 reuse", generation(REUSE), "PASSED", REUSE),
                        (
                            "TC03/TC04 missing or empty signed capsule",
                            generation("Test_Info", MISSING_SIGNED_CAPSULE), "FAILED", MISSING_SIGNED_CAPSULE,
                        ),
                        (
                            "TC05 missing tool", generation("Test_Info", missing_tool, SETUP_FAILED),
                            "FAILED", missing_tool,
                        ),
                        (
                            "TC06 invalid memory threshold", generation("Test_Info", invalid_memory, SETUP_FAILED),
                            "FAILED", invalid_memory,
                        ),
                        (
                            "TC07 insufficient memory",
                            generation(
                                "Test_Info", RESOURCE_INFO,
                                "WARNING: Target system does not have sufficient memory to generate "
                                "unauth.bin and tampered.bin on-device",
                                short_memory, OFFLINE,
                            ),
                            "SKIPPED", OFFLINE,
                        ),
                        (
                            "TC08 insufficient storage",
                            generation(
                                "Test_Info", RESOURCE_INFO, short_storage,
                                "Insufficient storage for on-device capsule variant generation", OFFLINE,
                            ),
                            "SKIPPED", OFFLINE,
                        ),
                        (
                            "TC09 de-authentication failure",
                            generation(
                                "Test_Info", "Generating unauth.bin from signed_capsule.bin",
                                failed_unauth, marker_cleared, SETUP_FAILED,
                            ),
                            "FAILED", failed_unauth,
                        ),
                        (
                            "TC10 tamper failure", generation("Test_Info", PROGRESS, failed_tamper, SETUP_FAILED),
                            "FAILED", failed_tamper,
                        ),
                        ("TC11 interrupted recovery", generation(RECOVERY, PROGRESS, SUCCESS), "PASSED", RECOVERY),
                        ("TC12 partial publication failure", partial_failure, "FAILED", failed_publish),
                        (
                            "TC13 partial publication recovery",
                            partial_failure + "\n" + generation(RECOVERY, PROGRESS, SUCCESS), "PASSED", RECOVERY,
                        ),
                        (
                            "TC14 synchronization failure", generation("Test_Info", PROGRESS, failed_sync, SETUP_FAILED),
                            "FAILED", failed_sync,
                        ),
                        (
                            "TC15 marker synchronization failure",
                            generation("Test_Info", failed_marker_sync, marker_cleared, SETUP_FAILED),
                            "FAILED", failed_marker_sync,
                        ),
                    ]
                    for name, log, status, evidence in cases:
                        with self.subTest(case=name):
                            data = self.parse(log)
                            self.assertEqual(len(data["test_results"][0]["subtests"]), 1)
                            self.assert_generation(data, status, evidence)

